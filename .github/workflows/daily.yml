name: Daily 6 videos

on:
  schedule:
    - cron: "30 1 * * *"   # 07:00 AM IST every day (01:30 UTC)
  workflow_dispatch:        # manual "Run workflow" button

permissions:
  contents: write           # needed to publish the videos as a GitHub Release

jobs:
  make-videos:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ffmpeg and fonts
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: pip install -r requirements.txt
      - name: Make videos
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NICHE: ${{ vars.NICHE }}
          VIDEOS_PER_RUN: ${{ vars.VIDEOS_PER_RUN }}
          VOICE: ${{ vars.VOICE }}
          CAPTIONS: ${{ vars.CAPTIONS }}
        run: python main.py
      - name: Publish videos as a GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="videos-$(date -u +%Y-%m-%d-%H%M)"
          gh release create "$TAG" out/*.mp4 \
            --title "Videos $(date -u +%d-%b-%Y)" \
            --notes-file out/titles.txt
      - name: Keep only the latest 7 releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release list --limit 100 --json tagName -q '.[].tagName' \
            | tail -n +8 \
            | xargs -r -I{} gh release delete {} --cleanup-tag -y
